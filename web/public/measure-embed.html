<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Measure embed height</title>
<!--
  Local tool. Not part of the site.

  Pastes a third-party widget snippet into an iframe sandboxed exactly as
  AdSlot sandboxes it in production, then reports the height the widget
  actually renders at. That number goes in the Advertiser's "Embed height (px)"
  field in Sanity.

  Measuring here rather than eyeballing matters because the sandbox changes the
  answer. A widget that needs localStorage throws in the opaque origin this
  sandbox creates, renders short or blank, and would have measured fine
  anywhere else. If it breaks here, it breaks on the site.

  The parent cannot read into the frame - no allow-same-origin, by design - so
  the frame measures itself and postMessages the number out.

  DELETE THIS FILE before launch, or it ships at /measure-embed.html.
-->
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #d8d4cc;
    --paper: #faf8f5;
    --sunk: #f0ece5;
    --accent: #7a1f2b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 0.9rem; }
  .grid { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 28px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 160px; padding: 12px; font: 13px/1.45 ui-monospace, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); resize: vertical;
  }
  .widths { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; }
  .widths button {
    padding: 7px 14px; border: 1px solid var(--line); background: #fff; border-radius: 999px;
    font-size: 0.85rem; cursor: pointer; color: var(--ink);
  }
  .widths button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  input[type=number] { width: 110px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .go {
    margin-top: 16px; padding: 11px 22px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  .readout { border: 1px solid var(--line); border-radius: 8px; padding: 20px; background: #fff; min-width: 260px; }
  .num { font-size: 2.6rem; font-weight: 700; line-height: 1; margin: 2px 0 2px; font-variant-numeric: tabular-nums; }
  .num span { font-size: 1rem; font-weight: 400; color: var(--muted); }
  .rec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .rec .num { color: var(--accent); }
  .hint { font-size: 0.82rem; color: var(--muted); margin-top: 10px; }
  .stage { margin-top: 32px; }
  .stage-inner { display: inline-block; background: var(--sunk); padding: 12px; border-radius: 8px; }
  iframe { display: block; border: 0; background: #fff; }
  .warn { margin-top: 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: #fff; font-size: 0.88rem; display: none; }
</style>
</head>
<body>
<main>
  <h1>Measure embed height</h1>
  <p class="sub">Paste a Travelpayouts widget snippet, pick the slot width, and read off the height for Sanity.</p>

  <div class="grid">
    <div>
      <label for="code">Widget snippet</label>
      <textarea id="code" spellcheck="false" placeholder="&lt;script async src=&quot;https://tp.media/content?...&quot;&gt;&lt;/script&gt;"></textarea>

      <label style="margin-top:20px">Slot width</label>
      <div class="widths" id="widths">
        <button type="button" data-w="336" aria-pressed="true">336 — slots B, C, E</button>
        <button type="button" data-w="300" aria-pressed="false">300 — slot D</button>
        <button type="button" data-w="970" aria-pressed="false">970 — slot F</button>
        <button type="button" data-w="360" aria-pressed="false">360 — phone check</button>
      </div>
      <input type="number" id="custom" placeholder="custom" min="120" max="1200">

      <br><button class="go" id="go">Render and measure</button>
    </div>

    <div class="readout">
      <label>Measured</label>
      <div class="num" id="measured">—<span> px</span></div>
      <div class="rec">
        <label>Put this in Sanity</label>
        <div class="num" id="recommended">—<span> px</span></div>
        <p class="hint">Measured height plus a 20px cushion, as the field asks for. A clipped Search button converts nothing.</p>
      </div>
    </div>
  </div>

  <div class="warn" id="warn"></div>

  <div class="stage">
    <div class="stage-inner"><iframe id="frame" width="336" height="200"
      sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"></iframe></div>
  </div>
</main>

<script>
(function () {
  var width = 336
  var frame = document.getElementById('frame')
  var measured = document.getElementById('measured')
  var recommended = document.getElementById('recommended')
  var warn = document.getElementById('warn')
  var settleTimer = null

  document.getElementById('widths').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return
    width = Number(b.dataset.w)
    document.getElementById('custom').value = ''
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', String(x === b))
    })
  })

  document.getElementById('custom').addEventListener('input', function () {
    if (!this.value) return
    width = Number(this.value)
    Array.prototype.forEach.call(document.querySelectorAll('#widths button'), function (x) {
      x.setAttribute('aria-pressed', 'false')
    })
  })

  function show(h) {
    measured.innerHTML = h + '<span> px</span>'
    recommended.innerHTML = (h + 20) + '<span> px</span>'
    frame.height = Math.max(h, 40)
    frame.style.height = Math.max(h, 40) + 'px'
  }

  // The frame measures itself: with no allow-same-origin it has an opaque
  // origin, so nothing here can reach into its document. It reports on every
  // resize because widgets settle late - fonts, images, an async fetch of
  // prices - and the last number is the honest one.
  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow) return
    if (!e.data || e.data.kind !== 'embed-height') return
    var h = Math.ceil(e.data.height)
    if (!h || h < 1) return
    show(h)
    clearTimeout(settleTimer)
    settleTimer = setTimeout(function () {
      if (h < 60) {
        warn.textContent = 'Only ' + h + 'px. The widget probably failed to render — most likely it needs localStorage, which throws in this sandbox. It will do the same on the site. Adding allow-same-origin to the sandbox in AdSlot.tsx fixes it, at the cost of the isolation.'
        warn.style.display = 'block'
      }
    }, 2500)
  })

  document.getElementById('go').addEventListener('click', function () {
    var code = document.getElementById('code').value.trim()
    if (!code) return
    warn.style.display = 'none'
    measured.innerHTML = '…<span> px</span>'
    recommended.innerHTML = '…<span> px</span>'

    frame.width = width
    frame.style.width = width + 'px'
    frame.height = 200
    frame.style.height = '200px'

    // Same document shape AdSlot builds, plus the reporter.
    frame.srcdoc =
      '<!doctype html><html><head><meta charset="utf-8"><base target="_blank">' +
      '<style>html,body{margin:0;padding:0;font-family:system-ui,sans-serif}</style></head><body>' +
      code +
      '<script>(function(){function send(){parent.postMessage({kind:"embed-height",' +
      'height:document.documentElement.scrollHeight},"*")}' +
      'if(window.ResizeObserver){new ResizeObserver(send).observe(document.documentElement)}' +
      'window.addEventListener("load",send);setInterval(send,700);send()})()<\/script>' +
      '</body></html>'
  })
})()
</script>
</body>
</html>
