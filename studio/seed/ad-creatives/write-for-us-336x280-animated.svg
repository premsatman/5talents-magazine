<svg xmlns="http://www.w3.org/2000/svg" width="336" height="280" viewBox="0 0 384 320" role="img" aria-label="5Talents: Write for us. Pitches from students and first-timers welcome. Send a pitch.">
<title>5Talents: Write for us</title>
<defs>
<style>
@font-face{font-family:'PB';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}
@font-face{font-family:'PR';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.b{font-family:'PB',Poppins,Arial,sans-serif;font-weight:700}
.r{font-family:'PR',Poppins,Arial,sans-serif;font-weight:400}
.in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.logo{transform-box:fill-box;transform-origin:center;animation:logo .6s .1s cubic-bezier(.3,1.4,.5,1) both}
.w1{animation-delay:.45s}.w2{animation-delay:.6s}.w3{animation-delay:.75s}
.l1{animation-name:fade;animation-delay:1.15s}.l2{animation-name:fade;animation-delay:1.3s}
.btn{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .55s 1.6s cubic-bezier(.3,1.5,.5,1) both,pulse 3.2s 3s ease-in-out infinite}
.shine{animation:shine 3.2s 2.4s ease-in-out infinite}
@keyframes logo{from{opacity:0;transform:scale(.4) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.045)}90%{transform:scale(.99)}}
@keyframes shine{0%{transform:translateX(-90px)}35%,100%{transform:translateX(300px)}}
@media (prefers-reduced-motion:reduce){.in,.btn,.shine,.logo{animation:none!important;opacity:1}.shine{display:none}}
</style>
<clipPath id="bc"><rect x="23" y="206" width="200" height="44"/></clipPath>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="384" height="320" fill="#FFED0A"/>
<g class="logo"><g transform="translate(24 44) scale(.019)"><rect width="2000" height="2000" fill="#15130F"/><g transform="translate(0 2000) scale(.1 -.1)"><path fill="#FFFFFF" d="M4160 16131 c0 -4 -81 -1650 -180 -3657 -99 -2007 -180 -3664 -180 -3681 l0 -33 945 0 945 0 0 258 c0 372 20 550 85 750 45 140 112 255 198 342 193 194 427 281 757 281 332 0 562 -90 757 -295 126 -131 196 -288 246 -544 l22 -117 0 -1695 0 -1695 -17 -95 c-79 -440 -270 -682 -628 -794 -300 -95 -677 -67 -941 70 -249 130 -380 336 -451 709 l-21 110 -4 738 -4 737 -945 0 -944 0 0 -652 c0 -359 5 -716 10 -793 33 -462 110 -827 251 -1185 297 -759 855 -1265 1644 -1491 628 -180 1490 -182 2136 -5 627 172 1120 533 1445 1058 286 463 437 1019 475 1753 15 290 7 3412 -9 3580 -55 564 -148 951 -313 1295 -123 254 -242 426 -413 595 -383 378 -895 552 -1564 532 -371 -11 -633 -72 -907 -212 -275 -139 -491 -326 -668 -578 -34 -49 -68 -96 -75 -105 l-13 -17 5 70 c3 39 40 716 82 1505 41 789 77 1441 80 1448 3 9 359 12 1739 12 l1735 0 0 905 0 905 -2640 0 c-1486 0 -2640 -4 -2640 -9z M10550 15235 l0 -905 1045 0 1045 0 0 -5460 0 -5460 1005 0 1005 0 0 5460 0 5460 1045 0 1045 0 0 905 0 905 -3095 0 -3095 0 0 -905z"/></g></g></g>
<g class="b" font-size="47" letter-spacing="-1.9" fill="#15130F">
<text class="in w1" x="23" y="139">Write</text>
<text class="in w2" x="156" y="139">for</text>
<text class="in w3" x="227" y="139">us.</text>
</g>
<text class="r in l1" x="24" y="171" font-size="16.4" fill="#15130F">Pitches from students and first-timers</text>
<text class="r in l2" x="24" y="193" font-size="16.4" fill="#15130F">welcome.</text>
<g class="btn">
<rect x="23" y="206" width="200" height="44" fill="#15130F"/>
<g clip-path="url(#bc)"><g transform="skewX(-20)"><rect class="shine" x="0" y="200" width="60" height="56" fill="url(#sg)"/></g></g>
<text class="b" x="123" y="236" font-size="17.6" text-anchor="middle" fill="#FFED0A">Send a pitch</text>
</g>
</svg>